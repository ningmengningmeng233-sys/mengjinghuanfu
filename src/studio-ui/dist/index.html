  <style>
:root {
  --bg-deep: #070912;
  --bg-shell: #0b0e18;
  --bg-panel: rgba(16, 20, 32, 0.78);
  --bg-panel-solid: #111524;
  --bg-card: rgba(24, 29, 46, 0.68);
  --bg-card-hi: rgba(33, 40, 62, 0.82);
  --bg-hover: rgba(255, 255, 255, 0.065);
  --border: rgba(255, 255, 255, 0.085);
  --border-hi: rgba(255, 255, 255, 0.17);
  --specular: rgba(255, 255, 255, 0.11);
  --fg: #f4f6fc;
  --fg-2: #c6cde0;
  --fg-muted: #848ea8;
  --accent: #68a4ff;
  --accent-2: #a78bfa;
  --accent-cyan: #5ce1e6;
  --accent-soft: rgba(104, 164, 255, 0.16);
  --accent-glow: rgba(104, 164, 255, 0.36);
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.15);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --r-island: 18px;
  --r-card: 14px;
  --r-ctl: 10px;
  --shadow-island: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 var(--specular);
  --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --font: 'Segoe UI Variable', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', -apple-system, sans-serif;
}

html[data-prism-theme="light"] {
  --bg-deep: #e9eff8;
  --bg-shell: #eef3fb;
  --bg-panel: rgba(255, 255, 255, 0.84);
  --bg-panel-solid: #ffffff;
  --bg-card: rgba(246, 249, 255, 0.86);
  --bg-card-hi: rgba(255, 255, 255, 0.96);
  --bg-hover: rgba(15, 23, 42, 0.05);
  --border: rgba(15, 23, 42, 0.09);
  --border-hi: rgba(15, 23, 42, 0.18);
  --specular: rgba(255, 255, 255, 0.92);
  --fg: #0f172a;
  --fg-2: #334155;
  --fg-muted: #64748b;
  --accent: #3b82f6;
  --accent-2: #8b5cf6;
  --accent-soft: rgba(59, 130, 246, 0.12);
  --accent-glow: rgba(59, 130, 246, 0.26);
  --shadow-island: 0 16px 40px rgba(15, 23, 42, 0.08), inset 0 1px 0 var(--specular);
  --shadow-card: 0 6px 18px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

*, *::before, *::after { box-sizing: border-box; }
html, body, #app {
  width: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: var(--font);
  font-size: 13px;
  color: var(--fg);
  background: var(--bg-deep);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* Dynamic ambient aurora backdrop */
body::before, body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 0;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.42;
  transition: background 450ms ease;
}
body::before {
  width: 520px;
  height: 520px;
  left: -140px;
  top: -160px;
  background: radial-gradient(circle, var(--accent) 0%, transparent 68%);
}
body::after {
  width: 480px;
  height: 480px;
  right: -120px;
  bottom: -160px;
  background: radial-gradient(circle, var(--accent-2) 0%, transparent 68%);
}
#app { position: relative; z-index: 1; }

/* Custom sleek scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

/* Boot splash */
.ds-boot {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.ds-boot-icon {
  width: 72px;
  height: 72px;
  border-radius: 18px;
  box-shadow: 0 14px 36px rgba(92, 225, 230, 0.25);
  animation: ds-float 2.4s ease-in-out infinite;
}
@keyframes ds-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.ds-boot-title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
.ds-boot-sub { font-size: 12.5px; color: var(--fg-muted); }

/* Main two-column shell */
.ds-shell {
  display: grid;
  grid-template-columns: 256px 1fr;
  height: 100dvh;
  gap: 12px;
  padding: 12px;
}

.ds-sidebar, .ds-main {
  background: var(--bg-panel);
  backdrop-filter: blur(26px) saturate(1.4);
  -webkit-backdrop-filter: blur(26px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--r-island);
  box-shadow: var(--shadow-island);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* Sidebar brand */
.ds-brand {
  padding: 16px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 11px;
}
.ds-brand-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
.ds-brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.ds-brand-title {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ds-brand-sub { font-size: 11px; color: var(--fg-muted); }
.ds-ver-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 2px 7px;
  border-radius: 99px;
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.22), rgba(167, 139, 250, 0.25));
  border: 1px solid rgba(167, 139, 250, 0.38);
  color: #dbeafe;
}

/* Sidebar app list */
.ds-apps-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ds-nav-group-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  padding: 8px 8px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  letter-spacing: 0.3px;
}
.ds-app-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--fg-2);
  cursor: pointer;
  text-align: left;
  transition: all 150ms cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}
.ds-app-row:hover {
  background: var(--bg-hover);
  color: var(--fg);
}
.ds-app-row.uninstalled { opacity: 0.56; }
.ds-app-row.uninstalled:hover, .ds-app-row.uninstalled.active { opacity: 1; }
.ds-app-row.active {
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.18), rgba(167, 139, 250, 0.12));
  border-color: rgba(126, 178, 255, 0.42);
  color: var(--fg);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.ds-app-avatar {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 3px 8px rgba(0, 0, 0, 0.25);
}
.ds-app-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.ds-app-name-line {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ds-app-sub-line {
  font-size: 11px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.ds-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #525d78;
}
.ds-dot.active {
  background: var(--ok);
  box-shadow: 0 0 9px rgba(52, 211, 153, 0.7);
}
.ds-dot.running {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(104, 164, 255, 0.55);
}
.ds-dot.warn {
  background: var(--warn);
  box-shadow: 0 0 8px rgba(251, 191, 36, 0.65);
}
.ds-dot.yielded {
  background: #a78bfa;
  box-shadow: 0 0 8px rgba(167, 139, 250, 0.6);
}

.ds-uninstalled-toggle {
  background: none;
  border: none;
  color: var(--fg-muted);
  font-size: 11px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 6px;
}
.ds-uninstalled-toggle:hover { color: var(--fg); background: var(--bg-hover); }

/* Sidebar footer */
.ds-sidebar-foot {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: rgba(0, 0, 0, 0.14);
}

/* Main Header */
.ds-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  background: rgba(255, 255, 255, 0.015);
}
.ds-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ds-cur-title { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
.ds-status-pill {
  font-size: 11.5px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ds-status-pill.ok { border-color: rgba(52, 211, 153, 0.35); background: var(--ok-soft); color: #a7f3d0; }
.ds-status-pill.warn { border-color: rgba(251, 191, 36, 0.4); background: var(--warn-soft); color: #fde68a; }
.ds-status-pill.yielded { border-color: rgba(167, 139, 250, 0.4); background: rgba(167, 139, 250, 0.15); color: #ddd6fe; }

.ds-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.ds-tabs {
  display: flex;
  gap: 4px;
  background: rgba(0, 0, 0, 0.22);
  padding: 3px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.ds-tab {
  border: none;
  background: transparent;
  color: var(--fg-2);
  padding: 6px 13px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 140ms ease;
}
.ds-tab:hover { color: var(--fg); }
.ds-tab.active {
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.26), rgba(167, 139, 250, 0.24));
  color: #fff;
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

/* Body scrollable workspace */
.ds-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

/* Onboarding 3-step guide */
.ds-guide-card {
  border-radius: var(--r-card);
  border: 1px solid rgba(104, 164, 255, 0.32);
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.08), rgba(104, 164, 255, 0.1) 48%, rgba(167, 139, 250, 0.1));
  padding: 15px 18px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ds-guide-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ds-guide-title {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ds-guide-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.ds-guide-step {
  background: rgba(10, 14, 25, 0.56);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.ds-step-num {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent), var(--accent-2));
  color: #070a14;
  font-weight: 800;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ds-step-body { display: flex; flex-direction: column; gap: 3px; line-height: 1.45; }
.ds-step-body b { font-size: 12.5px; color: var(--fg); }
.ds-step-body span { font-size: 11.5px; color: var(--fg-muted); }
.ds-guide-note {
  font-size: 11.5px;
  color: var(--fg-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 2px;
}

/* Obsidian Prism Coexistence & Switch Hub */
.ds-compat-hub {
  border-radius: var(--r-card);
  border: 1px solid rgba(251, 191, 36, 0.42);
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.11), rgba(167, 139, 250, 0.1));
  padding: 15px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--shadow-card);
}
.ds-compat-hub.peaceful {
  border-color: rgba(167, 139, 250, 0.45);
  background: linear-gradient(135deg, rgba(167, 139, 250, 0.13), rgba(52, 211, 153, 0.08));
}
.ds-compat-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ds-compat-title {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ds-compat-desc {
  font-size: 12px;
  color: var(--fg-2);
  margin-top: 4px;
  line-height: 1.5;
}
.ds-compat-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.ds-compat-option {
  background: rgba(10, 13, 24, 0.62);
  border: 1px solid var(--border-hi);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}
.ds-compat-option.active-plan {
  border-color: rgba(52, 211, 153, 0.6);
  box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.25);
}
.ds-compat-opt-title { font-size: 13px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.ds-compat-opt-desc { font-size: 11.5px; color: var(--fg-muted); line-height: 1.5; margin-top: 4px; }
.ds-compat-steps-box {
  background: rgba(0, 0, 0, 0.28);
  border: 1px dashed rgba(255, 255, 255, 0.16);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 11.5px;
  color: var(--fg-2);
  line-height: 1.55;
}

/* Mode Switcher Cards (Mode 1: Prism Liquid Glass vs Mode 2: Classic Theme Library) */
.ds-mode-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ds-mode-card {
  position: relative;
  border-radius: var(--r-card);
  border: 1px solid var(--border);
  background: var(--bg-card);
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  color: var(--fg);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
  overflow: hidden;
}
.ds-mode-card:hover {
  border-color: var(--border-hi);
  background: var(--bg-card-hi);
  transform: translateY(-1px);
}
.ds-mode-card.active {
  border-color: rgba(114, 178, 255, 0.72);
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.12), rgba(104, 164, 255, 0.14) 55%, rgba(167, 139, 250, 0.14));
  box-shadow: 0 8px 24px rgba(104, 164, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
.ds-mode-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
}
.ds-mode-card.active .ds-mode-icon {
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.28), rgba(167, 139, 250, 0.32));
  border-color: rgba(255, 255, 255, 0.22);
}
.ds-mode-body { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.ds-mode-title {
  font-size: 13.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ds-mode-tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 99px;
  background: rgba(92, 225, 230, 0.18);
  color: #a5f3fc;
  font-weight: 600;
}
.ds-mode-tag.classic {
  background: rgba(167, 139, 250, 0.2);
  color: #e9d5ff;
}
.ds-mode-desc { font-size: 11.5px; color: var(--fg-muted); line-height: 1.45; }

/* Banner notifications */
.ds-banner {
  padding: 12px 15px;
  border-radius: var(--r-card);
  border: 1px solid var(--border-hi);
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ds-banner.warn { border-color: rgba(251, 191, 36, 0.45); background: var(--warn-soft); }
.ds-banner.accent {
  border-color: rgba(104, 164, 255, 0.4);
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.14), rgba(167, 139, 250, 0.08));
}
.ds-banner-text { flex: 1; min-width: 180px; line-height: 1.5; font-size: 12.5px; }

/* Hero Live Preview + Quick Controls Split Stage */
.ds-hero-grid {
  display: grid;
  grid-template-columns: minmax(290px, 1.15fr) minmax(280px, 1fr);
  gap: 14px;
}

.ds-stage-wrap {
  position: relative;
  border-radius: var(--r-card);
  overflow: hidden;
  border: 1px solid var(--border-hi);
  background: #0b0f1d;
  min-height: 268px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-card);
}
.ds-stage-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-image: radial-gradient(circle at 20% 25%, #38bdf8 0%, transparent 45%),
                    radial-gradient(circle at 80% 70%, #a855f7 0%, transparent 50%),
                    linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d1a 100%);
  transition: filter 220ms ease, transform 300ms ease;
}
.ds-stage-scrim {
  position: absolute;
  inset: 0;
  transition: background 180ms ease;
}
.ds-stage-mock-wrap {
  position: relative;
  z-index: 2;
  flex: 1;
  padding: 16px 16px 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ds-mock-window {
  width: 100%;
  height: 196px;
  border-radius: 13px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
  transition: all 220ms ease;
}
.ds-mock-window.flush { border-radius: 6px; }
.ds-mock-bar {
  height: 26px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.75);
}
.ds-mock-dots { display: flex; gap: 5px; }
.ds-mock-dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.ds-mock-dots i:nth-child(1) { background: #fb7185; }
.ds-mock-dots i:nth-child(2) { background: #fbbf24; }
.ds-mock-dots i:nth-child(3) { background: #34d399; }
.ds-mock-body {
  flex: 1;
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 8px;
  padding: 8px;
}
.ds-mock-window.flush .ds-mock-body { gap: 0; padding: 0; }
.ds-mock-side, .ds-mock-pane {
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 220ms ease;
}
.ds-mock-window.flush .ds-mock-side, .ds-mock-window.flush .ds-mock-pane {
  border-radius: 0;
  border-top: none;
  border-bottom: none;
}
.ds-mock-line {
  height: 7px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.16);
}
.ds-mock-line.accent { background: var(--accent); opacity: 0.85; width: 65%; }
.ds-mock-line.short { width: 48%; }
.ds-mock-line.med { width: 78%; }
.ds-mock-code-card {
  margin-top: auto;
  border-radius: 7px;
  padding: 7px 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.ds-stage-foot {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 3;
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(8, 11, 20, 0.72);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ds-stage-wall-info { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ds-stage-wall-name { font-size: 12px; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-stage-live-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(92, 225, 230, 0.22);
  color: #a5f3fc;
  flex-shrink: 0;
}

/* Right control card next to preview stage */
.ds-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  box-shadow: var(--shadow-card);
}
.ds-sec-title {
  font-weight: 700;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.ds-muted { color: var(--fg-muted); font-size: 12px; }

/* 4 Scene preset cards */
.ds-scene-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.ds-scene-card {
  border: 1px solid var(--border);
  background: rgba(12, 16, 28, 0.62);
  color: var(--fg);
  border-radius: 11px;
  padding: 10px 11px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: all 150ms ease;
}
.ds-scene-card:hover { border-color: var(--border-hi); transform: translateY(-1px); background: rgba(24, 30, 48, 0.8); }
.ds-scene-card.active {
  border-color: var(--accent);
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.2), rgba(167, 139, 250, 0.14));
  box-shadow: 0 0 0 1px rgba(104, 164, 255, 0.3);
}
.ds-scene-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ds-scene-name { font-weight: 700; font-size: 12.5px; }
.ds-scene-ico { font-size: 13px; opacity: 0.9; }
.ds-scene-desc { font-size: 11px; color: var(--fg-muted); line-height: 1.35; }

/* Custom sleek sliders */
.ds-sliders-stack { display: flex; flex-direction: column; gap: 11px; }
.ds-slider-box { display: flex; flex-direction: column; gap: 6px; }
.ds-slider-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-2); }
.ds-slider-val {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--fg);
}
input[type="range"].ds-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent-cyan) 0%, var(--accent) var(--pct, 50%), rgba(255, 255, 255, 0.12) var(--pct, 50%));
  outline: none;
  cursor: pointer;
}
input[type="range"].ds-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid var(--accent);
  box-shadow: 0 0 12px var(--accent-glow), 0 2px 6px rgba(0, 0, 0, 0.4);
  transition: transform 120ms ease;
}
input[type="range"].ds-range::-webkit-slider-thumb:hover { transform: scale(1.15); }

/* Direct color scheme dots bar */
.ds-scheme-dots {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ds-scheme-dot-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px 4px 6px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: rgba(12, 16, 28, 0.55);
  color: var(--fg-2);
  font-size: 11.5px;
  cursor: pointer;
  transition: all 140ms ease;
}
.ds-scheme-dot-btn:hover { border-color: var(--border-hi); color: var(--fg); }
.ds-scheme-dot-btn.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--fg);
  font-weight: 600;
}
.ds-swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  flex-shrink: 0;
}

/* Buttons */
.ds-btn {
  border: 1px solid var(--border-hi);
  background: rgba(255, 255, 255, 0.055);
  color: var(--fg);
  padding: 8px 13px;
  border-radius: var(--r-ctl);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 150ms ease;
  white-space: nowrap;
}
.ds-btn:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 255, 255, 0.28); }
.ds-btn:active { transform: scale(0.98); }
.ds-btn.primary {
  background: linear-gradient(135deg, #4f8cff 0%, #7c6bff 100%);
  border-color: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  box-shadow: 0 6px 18px rgba(96, 138, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.26);
}
.ds-btn.primary:hover {
  filter: brightness(1.08);
  box-shadow: 0 8px 24px rgba(96, 138, 255, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.32);
}
.ds-btn.success {
  background: linear-gradient(135deg, #10b981, #059669);
  border-color: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}
.ds-btn.danger {
  border-color: rgba(248, 113, 113, 0.42);
  background: rgba(248, 113, 113, 0.1);
  color: #fecaca;
}
.ds-btn.danger:hover { background: rgba(248, 113, 113, 0.2); border-color: rgba(248, 113, 113, 0.7); }
.ds-btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.ds-btn.ghost:hover { background: var(--bg-hover); color: var(--fg); }
.ds-btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 8px; }

/* Pill Switch (iOS/macOS style toggle) */
.ds-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 12px;
  color: var(--fg-2);
}
.ds-switch input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}
.ds-switch-track {
  width: 38px;
  height: 22px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid var(--border);
  position: relative;
  transition: background 180ms ease, border-color 180ms ease;
  flex-shrink: 0;
}
.ds-switch-track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
  transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-switch input:checked + .ds-switch-track {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  border-color: rgba(255, 255, 255, 0.22);
}
.ds-switch input:checked + .ds-switch-track::after { transform: translateX(16px); }

/* Toolbar, search, chips */
.ds-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ds-input {
  flex: 1;
  min-width: 150px;
  background: rgba(8, 11, 20, 0.65);
  border: 1px solid var(--border);
  border-radius: var(--r-ctl);
  color: var(--fg);
  padding: 7px 12px;
  font-size: 12.5px;
  outline: none;
  transition: border-color 140ms ease;
}
.ds-input:focus { border-color: var(--accent); }
.ds-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ds-chip {
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--fg-2);
  padding: 5px 11px;
  border-radius: 99px;
  cursor: pointer;
  font-size: 12px;
  transition: all 140ms ease;
}
.ds-chip:hover { border-color: var(--border-hi); color: var(--fg); }
.ds-chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--fg);
  font-weight: 600;
}

/* Cinema 16:10 Wallpaper Gallery */
.ds-wall-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 12px;
}
.ds-wall-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: #0d111e;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-wall-card:hover {
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38);
}
.ds-wall-card.active {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 1.5px var(--accent-cyan), 0 10px 26px rgba(92, 225, 230, 0.22);
}
.ds-wall-thumb {
  aspect-ratio: 16 / 10;
  background: linear-gradient(135deg, #161d33, #0e1322);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  font-size: 11.5px;
}
.ds-wall-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 280ms ease;
}
.ds-wall-card:hover .ds-wall-thumb img { transform: scale(1.05); }
.ds-wall-badge {
  position: absolute;
  top: 7px;
  right: 7px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(7, 10, 18, 0.72);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #f1f5f9;
}
.ds-wall-active-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(56, 189, 248, 0.45);
}
.ds-wall-meta {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: rgba(14, 18, 30, 0.94);
}
.ds-wall-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }

/* Advanced drawer */
details.prism-adv-drawer {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 12px 16px;
  box-shadow: var(--shadow-card);
}
details.prism-adv-drawer > summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  color: var(--fg-2);
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
details.prism-adv-drawer > summary::-webkit-details-marker { display: none; }
.ds-adv-body {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.ds-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
}

/* Dropzone overlay */
.ds-drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 950;
  background: rgba(7, 10, 18, 0.82);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.ds-drop-overlay.show { display: flex; }
.ds-drop-box {
  width: min(460px, 92vw);
  border: 2px dashed var(--accent-cyan);
  border-radius: 20px;
  padding: 36px 24px;
  text-align: center;
  background: rgba(16, 22, 38, 0.9);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ds-drop-box b { font-size: 16px; color: #fff; }
.ds-drop-box span { font-size: 12.5px; color: var(--fg-muted); }

/* Toast */
.ds-toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: rgba(14, 18, 30, 0.96);
  backdrop-filter: blur(16px);
  color: #f8fafc;
  border: 1px solid rgba(114, 178, 255, 0.42);
  padding: 11px 16px;
  border-radius: 12px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  z-index: 999;
  font-size: 12.5px;
  font-weight: 500;
  max-width: 420px;
  line-height: 1.45;
}

/* Responsive: Medium / Sidecar Aux Pane (<= 880px) */
@media (max-width: 880px) {
  .ds-hero-grid { grid-template-columns: 1fr; }
  .ds-guide-steps { grid-template-columns: 1fr; }
  .ds-compat-options { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .ds-shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    padding: 8px;
    gap: 8px;
  }
  .ds-brand { padding: 10px 12px; }
  .ds-apps-scroll {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 8px;
    gap: 6px;
  }
  .ds-nav-group-label { display: none; }
  .ds-app-row { width: auto; flex-shrink: 0; padding: 6px 10px; }
  .ds-app-avatar { width: 24px; height: 24px; font-size: 11px; }
  .ds-sidebar-foot { flex-direction: row; padding: 8px; }
  .ds-sidebar-foot .ds-btn { flex: 1; }
  .ds-mode-grid { grid-template-columns: 1fr; }
  .ds-header { padding: 11px 14px; }
  .ds-body { padding: 12px 14px 20px; }
}

</style>

<script>
(function bootDreamSkinPrismStudio() {

  var SCHEMES = [

    { id: 'rose-pine', name: '松间玫瑰', dot: '#EBBCBA', accent2: '#C4A7E7', panelBg: '29, 25, 40' },

    { id: 'gruvbox', name: '复古暖砂', dot: '#FABD2F', accent2: '#FE8019', panelBg: '34, 30, 26' },
    { id: 'host-native', name: '跟随原版', dot: '#3B82F6', accent2: '#60A5FA', panelBg: '18, 20, 28' },
  ];

  var APP_VISUALS = {
    antigravity: { glyph: 'A', bg: 'linear-gradient(135deg, #38bdf8, #818cf8)' },
    cherry: { glyph: 'C', bg: 'linear-gradient(135deg, #fb7185, #f43f5e)' },
    codex: { glyph: 'X', bg: 'linear-gradient(135deg, #34d399, #059669)' },
    dsh: { glyph: 'D', bg: 'linear-gradient(135deg, #60a5fa, #3b82f6)' },
    zcode: { glyph: 'Z', bg: 'linear-gradient(135deg, #a78bfa, #7c3aed)' },

    'minimax-design': { glyph: 'M', bg: 'linear-gradient(135deg, #ec4899, #a855f7)' },
    kiro: { glyph: 'K', bg: 'linear-gradient(135deg, #c084fc, #6366f1)' },
    windsurf: { glyph: 'W', bg: 'linear-gradient(135deg, #2dd4bf, #0d9488)' },
  };

  function loadGuidePref() {
    try { return window.localStorage.getItem('ds_prism_guide_hidden_v4') !== '1'; } catch (_) { return true; }
  }
  function saveGuidePref(show) {
    try { window.localStorage.setItem('ds_prism_guide_hidden_v4', show ? '0' : '1'); } catch (_) {}
  }

  var state = {
    version: '4.0.0',
    activeTab: 'home', // 'home' | 'apps'
    studioMode: 'prism', // 'prism' (液态玻璃动态壁纸) | 'classic' (经典3.0主题库与.dsskin)
    selectedAppId: 'antigravity',
    libSource: 'all', // 'all' | 'workshop' | 'local'
    searchQuery: '',
    apps: [],
    v4Store: { version: 4, global: {}, apps: {} },
    items: [],
    galleryItems: [],
    galleryLoading: false,
    galleryError: '',
    shortcutInfo: null,
    toast: '',
    toastTimer: 0,
    advOpen: false,
    showGuide: loadGuidePref(),
    showUninstalled: true,
    showTakeoverSteps: false,
    draggingOver: false,
  };

  function apiFetch(url, init) {
    if (window.sidecar && typeof window.sidecar.fetch === 'function') {
      return window.sidecar.fetch(url, init);
    }
    var opts = Object.assign({}, init || {});
    var headers = new Headers(opts.headers || {});
    try {
      var tok = new URLSearchParams(window.location.search).get('token') || (window.__SIDECAR_BOOT__ && window.__SIDECAR_BOOT__.token) || '';
      if (tok && !headers.has('X-Sidecar-Token')) headers.set('X-Sidecar-Token', tok);
    } catch (_) {}
    opts.headers = headers;
    return window.fetch(url, opts);
  }

  function apiJson(url, opts) {
    var init = Object.assign({}, opts || {});
    if (init.body && typeof init.body === 'object' && !(init.body instanceof ArrayBuffer) && !(init.body instanceof Blob)) {
      var h = new Headers(init.headers || {});
      if (!h.has('Content-Type')) h.set('Content-Type', 'application/json');
      init.headers = h;
      init.body = JSON.stringify(init.body);
    }
    return apiFetch(url, init).then(function (r) {
      return r.text().then(function (txt) {
        var data = {};
        try { data = txt ? JSON.parse(txt) : {}; } catch (_) {}
        if (!r.ok) throw new Error(data.error || ('请求失败 ' + r.status));
        return data;
      });
    });
  }

  function showToast(msg) {
    state.toast = String(msg || '');
    clearTimeout(state.toastTimer);
    renderToastOnly();
    state.toastTimer = setTimeout(function () {
      state.toast = '';
      renderToastOnly();
    }, 3600);
  }

  function renderToastOnly() {
    var old = document.getElementById('ds-toast');
    if (!state.toast) {
      if (old) old.remove();
      return;
    }
    if (!old) {
      old = document.createElement('div');
      old.id = 'ds-toast';
      old.className = 'ds-toast';
      document.body.appendChild(old);
    }
    old.textContent = state.toast;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function currentApp() {
    return state.apps.find(function (a) { return a.id === state.selectedAppId; }) || state.apps[0] || { id: 'antigravity', name: 'Antigravity (反重力)', channel: 'exe', pluginConflicts: [], skinEnabled: true };
  }

  function currentConfig() {
    var g = (state.v4Store && state.v4Store.global) || {};
    var appEntry = (state.v4Store && state.v4Store.apps && state.v4Store.apps[state.selectedAppId]) || null;
    if (appEntry && !appEntry.inheritGlobal && appEntry.overrides) {
      return Object.assign({}, g, appEntry.overrides, { skinEnabled: appEntry.skinEnabled !== false });
    }
    return Object.assign({}, g, { skinEnabled: appEntry ? appEntry.skinEnabled !== false : true });
  }

  function activeWallpaperOf(cfg) {
    var wid = cfg && cfg.activeWallpaperId;
    if (wid) {
      var found = (state.items || []).find(function (it) { return it.id === wid; });
      if (found) return found;
    }
    return (state.items && state.items[0]) || null;
  }

  function schemeInfoOf(id) {
    return SCHEMES.find(function (s) { return s.id === id; }) || SCHEMES[0];
  }

  function applyAmbientAccent(cfg) {
    var s = schemeInfoOf(cfg && cfg.colorScheme);
    document.documentElement.style.setProperty('--accent', s.dot);
    document.documentElement.style.setProperty('--accent-2', s.accent2);
    if (cfg && cfg.themeMode === 'light') {
      document.documentElement.setAttribute('data-prism-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-prism-theme', 'dark');
    }
  }

  function hasPluginConflict(app) {
    return Boolean(app && app.pluginConflicts && app.pluginConflicts.length > 0);
  }

  function isPeacefulYield(app, cfg) {
    return hasPluginConflict(app) && cfg && cfg.skinEnabled === false;
  }

  function dotClass(app) {
    var appEntry = (state.v4Store && state.v4Store.apps && state.v4Store.apps[app.id]) || null;
    var enabled = appEntry ? appEntry.skinEnabled !== false : (app.skinEnabled !== false);
    if (hasPluginConflict(app) && !enabled) return 'yielded';
    if (app.canary && app.canary.state === 'tripped') return 'warn';
    if (hasPluginConflict(app) && enabled) return 'warn';
    if (app.attached || app.skinActive) return 'active';
    if (app.running) return 'running';
    return '';
  }

  function appStatusText(app) {
    var appEntry = (state.v4Store && state.v4Store.apps && state.v4Store.apps[app.id]) || null;
    var enabled = appEntry ? appEntry.skinEnabled !== false : (app.skinEnabled !== false);
    if (hasPluginConflict(app) && !enabled) return '已交给 ' + app.pluginConflicts[0].name;
    if (!enabled) return '已暂停换肤';
    if (app.canary && app.canary.state === 'tripped') return '保护模式（已暂停）';
    if (app.attached || app.skinActive) return '皮肤生效中';
    if (hasPluginConflict(app)) return '检测到插件共存';
    if (app.running) return '运行中 · 待连接';
    if (app.installed) return '已安装 · 未打开';
    return '未安装';
  }

  function statusPillClass(app) {
    var d = dotClass(app);
    if (d === 'active') return 'ok';
    if (d === 'warn') return 'warn';
    if (d === 'yielded') return 'yielded';
    return '';
  }

  function filteredLibrary() {
    var q = state.searchQuery.trim().toLowerCase();
    return (state.items || []).filter(function (it) {
      if (state.libSource === 'workshop' && it.source !== 'workshop') return false;
      if (state.libSource === 'local' && it.source === 'workshop') return false;
      if (q) {
        var hay = (String(it.title || '') + ' ' + String(it.id || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function loadState() {
    return apiJson('/api/state').then(function (data) {
      state.version = data.version || '4.0.0';
      state.apps = Array.isArray(data.apps) ? data.apps : [];
      state.v4Store = data.v4Store || state.v4Store;
      state.items = Array.isArray(data.items) ? data.items : [];
      if (state.apps.length && !state.apps.some(function (a) { return a.id === state.selectedAppId; })) {
        state.selectedAppId = state.apps[0].id;
      }
      var app = document.getElementById('app');
      if (app) app.setAttribute('data-prism-ready', 'true');
      render();
      loadShortcutStatus();
    }).catch(function (err) {
      var app = document.getElementById('app');
      if (app) app.setAttribute('data-prism-ready', 'true');
      showToast('连接管家失败：' + (err && err.message ? err.message : err));
      render();
    });
  }

  function loadShortcutStatus() {
    var app = currentApp();
    if (!app || app.channel === 'msix') {
      state.shortcutInfo = null;
      return;
    }
    apiJson('/api/apps/' + encodeURIComponent(app.id) + '/shortcuts').then(function (info) {
      state.shortcutInfo = info;
      render();
    }).catch(function () {});
  }

  function loadGallery() {
    state.galleryLoading = true;
    state.galleryError = '';
    render();
    var q = encodeURIComponent(state.searchQuery.trim());
    apiJson('/api/gallery?limit=18&q=' + q).then(function (data) {
      state.galleryLoading = false;
      state.galleryItems = Array.isArray(data.items) ? data.items : [];
      if (!data.ok && data.error) state.galleryError = data.error;
      render();
    }).catch(function (err) {
      state.galleryLoading = false;
      state.galleryError = err.message || '加载失败';
      render();
    });
  }

  function applyAppNow(appId, opts) {
    var force = Boolean(opts && opts.force);
    return apiJson('/api/apps/' + encodeURIComponent(appId) + '/apply', {
      method: 'POST',
      body: { force: force },
    }).then(function (r) {
      if (r && r.ok && !r.skipped) {
        showToast('已生效！' + currentApp().name + ' 皮肤已更新');
      } else if (r && r.reason === 'plugin-conflict') {
        showToast('请先在上方「共存与切换」里选择处理 Obsidian Prism 的方式');
      } else if (r && r.reason === 'not-debuggable') {
        showToast('已保存配置！点击上方「开启原图标自动换肤」后重新打开该软件即可生效');
      } else if (r && r.message) {
        showToast(r.message);
      }
      return loadState();
    });
  }

  function patchCurrentAppConfig(patch, andApply) {
    var appId = state.selectedAppId;
    return apiJson('/api/apps/' + encodeURIComponent(appId) + '/config', {
      method: 'POST',
      body: patch,
    }).then(function (res) {
      if (!state.v4Store.apps) state.v4Store.apps = {};
      state.v4Store.apps[appId] = res.entry;
      render();
      if (andApply) {
        return apiJson('/api/apps/' + encodeURIComponent(appId) + '/apply', { method: 'POST', body: {} }).then(function (r) {
          if (r && r.ok && !r.skipped) showToast('已应用到 ' + currentApp().name);
          else if (r && r.reason === 'not-debuggable') showToast('外观已保存（打开目标软件并启用原图标自动换肤后即时生效）');
          else if (r && r.message && r.reason !== 'plugin-conflict') showToast(r.message);
        });
      }
    }).catch(function (err) {
      showToast(err.message || '保存失败');
    });
  }

  function patchGlobalConfig(patch) {
    return apiJson('/api/config', { method: 'POST', body: patch }).then(function (res) {

  function uploadLocalFile(f) {
    if (!f) return;
    if (/\.dsskin$/i.test(f.name)) {
      showToast('正在导入旧皮肤包 ' + f.name + '…');
      f.text().then(function (txt) {
        return apiJson('/api/import/dsskin', { method: 'POST', body: { rawText: txt } });
      }).then(function (res) {
        showToast('已导入旧皮肤「' + (res.title || f.name) + '」');
        loadState();
      }).catch(function (err) { showToast(err.message || '导入失败'); });
      return;
    }
    showToast('正在导入壁纸 ' + f.name + '…');
    apiFetch('/api/library/upload?filename=' + encodeURIComponent(f.name), {
      method: 'POST',
      headers: { 'Content-Type': f.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name) },
      body: f,
    }).then(function (r) { return r.json(); }).then(function (res) {
      showToast(res.duplicate ? '已复用壁纸库中的相同文件' : '导入成功，正在为你选中');
      loadState().then(function () {
        if (res && res.item && res.item.id) {
          patchCurrentAppConfig({ activeWallpaperId: res.item.id, wallpaperId: res.item.id, skinEnabled: true }, true);
        }
      });
    }).catch(function (err) { showToast('导入失败：' + err.message); });
  }

            '<button class="ds-chip' + (cfg.themeMode === 'dark' ? ' active' : '') + '" data-theme-mode="dark">深色</button>' +

            '<button class="ds-chip' + (cfg.codeReadabilityMode === 'frosted' ? ' active' : '') + '" data-code-mode="frosted">磨砂护眼</button>' +

  function renderAppsTab() {

      '<div class="ds-muted" style="line-height:1.7">' +
        '• 在任意已换肤的软件窗口里，按 <b>Ctrl + Alt + W</b> 可直接呼出悬浮快捷调节窗；<br/>' +
        '• 万一觉得字看不清或界面不对劲，连按 <b>4 下 Esc</b>（或按 <b>Ctrl + Alt + Shift + R</b>），立刻清空皮肤、恢复软件原本样子；<br/>' +
        '• 梦境换肤 4.0 绝不修改任何软件的安装文件，所有美化均可随时无痕撤回。' +
      '</div>' +
      '<div class="ds-toolbar">' +
        '<button class="ds-btn sm" data-action="disable-shortcut">还原当前软件原图标默认参数</button>' +
        '<button class="ds-btn sm danger" data-action="restore-all">一键还原全部软件</button>' +
      '</div>' +
    '</div>';
  }

  function renderAppRow(a, curId) {
    var act = a.id === curId ? ' active' : '';
    var uninst = (!a.installed && a.id !== 'antigravity') ? ' uninstalled' : '';
    var vis = APP_VISUALS[a.id] || { glyph: a.name.slice(0, 1).toUpperCase(), bg: 'linear-gradient(135deg, #64748b, #475569)' };
    return '<button class="ds-app-row' + act + uninst + '" data-app-id="' + esc(a.id) + '">' +
      '<span class="ds-app-avatar" style="background:' + vis.bg + '">' + esc(vis.glyph) + '</span>' +
      '<span class="ds-app-info">' +
        '<span class="ds-app-name-line">' + esc(a.name) + '</span>' +
        '<span class="ds-app-sub-line"><span class="ds-dot ' + dotClass(a) + '"></span>' + esc(appStatusText(a)) + '</span>' +
      '</span>' +
    '</button>';
  }

  function render() {
    var root = document.getElementById('app');
    if (!root) return;
    var app = currentApp();
    var cfg = currentConfig();
    applyAmbientAccent(cfg);

    var installedApps = state.apps.filter(function (a) { return a.installed || a.id === 'antigravity'; });
    var otherApps = state.apps.filter(function (a) { return !a.installed && a.id !== 'antigravity'; });

    var iconUri = window.__PRISM_ICON_URI__ || '';
    var brandIconHtml = iconUri
      ? '<img class="ds-brand-icon" src="' + iconUri + '" alt="梦境换肤" />'
      : '<div class="ds-app-avatar" style="width:38px;height:38px;background:linear-gradient(135deg,#5ce1e6,#68a4ff,#a78bfa)">◆</div>';

    var appListHtml = '<div class="ds-nav-group-label"><span>本机软件（' + installedApps.length + '）</span></div>' +
      installedApps.map(function (a) { return renderAppRow(a, app.id); }).join('');

    if (otherApps.length > 0) {
      appListHtml += '<div class="ds-nav-group-label"><span>未安装（' + otherApps.length + '）</span>' +
        '<button class="ds-uninstalled-toggle" data-action="toggle-uninstalled">' + (state.showUninstalled ? '收起' : '展开') + '</button></div>';
      if (state.showUninstalled) {
        appListHtml += otherApps.map(function (a) { return renderAppRow(a, app.id); }).join('');
      }
    }

    root.innerHTML =
      '<div class="ds-shell">' +
        '<aside class="ds-sidebar">' +
          '<div class="ds-brand">' +
            brandIconHtml +
            '<div class="ds-brand-text">' +
              '<div class="ds-brand-title">梦境换肤 <span class="ds-ver-badge">PRISM ' + esc(state.version) + '</span></div>' +
              '<div class="ds-brand-sub">多软件动态壁纸与液态玻璃</div>' +
            '</div>' +
          '</div>' +
          '<div class="ds-apps-scroll">' + appListHtml + '</div>' +
          '<div class="ds-sidebar-foot">' +
            '<button class="ds-btn primary" data-action="sync-all">✨ 同步外观到全部软件</button>' +
            '<button class="ds-btn danger" data-action="restore-cur">还原当前软件</button>' +
          '</div>' +
        '</aside>' +

        '<main class="ds-main">' +
          '<header class="ds-header">' +
            '<div class="ds-header-left">' +
              '<span class="ds-cur-title">' + esc(app.name) + '</span>' +
              '<span class="ds-status-pill ' + statusPillClass(app) + '"><span class="ds-dot ' + dotClass(app) + '"></span>' + esc(appStatusText(app)) + '</span>' +
            '</div>' +
            '<div class="ds-header-right">' +
              '<label class="ds-switch" title="开启或暂停对此软件的换肤">' +
                '<input type="checkbox" id="ds-app-enabled-toggle"' + (cfg.skinEnabled !== false ? ' checked' : '') + ' />' +
                '<span class="ds-switch-track"></span>' +
                '<span>' + (cfg.skinEnabled !== false ? '换肤开启' : '已暂停') + '</span>' +
              '</label>' +
              '<button class="ds-btn primary sm" data-action="apply-cur">✦ 应用到软件</button>' +
              '<div class="ds-tabs">' +
                '<button class="ds-tab' + (state.activeTab === 'home' ? ' active' : '') + '" data-tab="home">外观设计</button>' +
                '<button class="ds-tab' + (state.activeTab === 'apps' ? ' active' : '') + '" data-tab="apps">软件与安全</button>' +
              '</div>' +
              '<button class="ds-btn sm ghost" data-action="toggle-guide" title="查看新手上手引导">? 引导</button>' +
            '</div>' +
          '</header>' +
          '<section class="ds-body">' +
            (state.activeTab === 'home' ? renderHome(app, cfg) : renderAppsTab()) +
          '</section>' +
        '</main>' +
      '</div>' +
      '<div class="ds-drop-overlay' + (state.draggingOver ? ' show' : '') + '" id="ds-drop-overlay">' +
        '<div class="ds-drop-box"><b>松开鼠标，立即导入到壁纸库</b><span>支持 PNG / JPG / WebP / MP4 / WebM 动态壁纸，以及旧版 .dsskin 皮肤包</span></div>' +
      '</div>' +
      '<input type="file" id="ds-file-input" style="display:none" accept="image/*,video/mp4,video/webm,.mov" />' +
      '<input type="file" id="ds-dsskin-input" style="display:none" accept=".dsskin,application/json" />';

    bindEvents(root);
    renderToastOnly();
  }

  function bindEvents(root) {
    root.querySelectorAll('[data-app-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.selectedAppId = btn.getAttribute('data-app-id');
        state.showTakeoverSteps = false;
        render();
        loadShortcutStatus();
      });
    });

    root.querySelectorAll('[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.activeTab = btn.getAttribute('data-tab');
        render();
      });
    });

    root.querySelectorAll('[data-studio-mode]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var nextMode = btn.getAttribute('data-studio-mode');
        state.studioMode = nextMode;
        if (nextMode === 'classic' && !state.galleryItems.length && !state.galleryLoading) {
          loadGallery();
        } else {
          render();
        }
      });
    });

    var appEnabledToggle = root.querySelector('#ds-app-enabled-toggle');
    if (appEnabledToggle) {
      appEnabledToggle.addEventListener('change', function () {
        var on = appEnabledToggle.checked;
        if (!on) {
          apiJson('/api/apps/' + encodeURIComponent(state.selectedAppId) + '/restore', { method: 'POST', body: {} }).then(function () {
            showToast('已暂停 ' + currentApp().name + ' 的换肤（已还原为原貌）');
            loadState();
          });
        } else {
          patchCurrentAppConfig({ skinEnabled: true }, true).then(function () { loadState(); });
        }
      });
    }

    root.querySelectorAll('[data-scene-preset]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-scene-preset');
        var card = SCENE_CARDS.find(function (c) { return c.id === id; });
        if (card) patchCurrentAppConfig(card.patch, true);
      });
    });

    root.querySelectorAll('input[data-slider]').forEach(function (el) {
      el.addEventListener('input', function () {
        var key = el.getAttribute('data-slider');
        var min = Number(el.min || 0);
        var max = Number(el.max || 100);
        var val = Number(el.value);
        el.style.setProperty('--pct', Math.round(((val - min) / (max - min)) * 100) + '%');
        var lbl = document.getElementById(key === 'glassOpacity' ? 'val-glass' : 'val-scrim');
        if (lbl) lbl.textContent = val + '%';
        var gEl = root.querySelector('input[data-slider="glassOpacity"]');
        var sEl = root.querySelector('input[data-slider="scrimOpacity"]');
        updateLivePreviewDom(gEl ? Number(gEl.value) : 76, sEl ? Number(sEl.value) : 26);
      });
      el.addEventListener('change', function () {
        var key = el.getAttribute('data-slider');
        var patch = {};
        patch[key] = Math.round(Number(el.value)) / 100;
        patchCurrentAppConfig(patch, true);
      });
    });

    root.querySelectorAll('[data-lib-src]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.libSource = btn.getAttribute('data-lib-src');
        render();
      });
    });

    var searchEl = root.querySelector('#ds-search');
    if (searchEl) {
      searchEl.addEventListener('input', function () {
        state.searchQuery = searchEl.value;
        if (state.studioMode !== 'classic') render();
      });
      searchEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && state.studioMode === 'classic') loadGallery();
      });
    }

    root.querySelectorAll('[data-pick-wall]').forEach(function (card) {
      card.addEventListener('click', function () {
        var wid = card.getAttribute('data-pick-wall');
        patchCurrentAppConfig({ activeWallpaperId: wid, wallpaperId: wid, skinEnabled: true }, true);
      });
    });

    root.querySelectorAll('[data-gallery-download]').forEach(function (card) {
      card.addEventListener('click', function () {
        var gid = card.getAttribute('data-gallery-download');
        showToast('正在下载在线主题…');
        apiJson('/api/gallery/download', { method: 'POST', body: { id: gid } }).then(function (r) {
          showToast('主题下载完成，正在为你应用…');
          loadState().then(function () {
            if (r && r.uploaded && r.uploaded.id) {
              patchCurrentAppConfig({ activeWallpaperId: r.uploaded.id, wallpaperId: r.uploaded.id, skinEnabled: true }, true);
            }
          });
        }).catch(function (err) { showToast(err.message); });
      });
    });

    var adv = root.querySelector('details.prism-adv-drawer');
    if (adv) {
      adv.addEventListener('toggle', function () {
        state.advOpen = adv.open;
      });
    }

    root.querySelectorAll('[data-scheme]').forEach(function (b) {
      b.addEventListener('click', function () { patchCurrentAppConfig({ colorScheme: b.getAttribute('data-scheme') }, true); });
    });
    root.querySelectorAll('[data-layout]').forEach(function (b) {
      b.addEventListener('click', function () { patchCurrentAppConfig({ layoutMode: b.getAttribute('data-layout') }, true); });
    });
    root.querySelectorAll('[data-theme-mode]').forEach(function (b) {
      b.addEventListener('click', function () { patchCurrentAppConfig({ themeMode: b.getAttribute('data-theme-mode') }, true); });
    });
    root.querySelectorAll('[data-code-mode]').forEach(function (b) {
      b.addEventListener('click', function () { patchCurrentAppConfig({ codeReadabilityMode: b.getAttribute('data-code-mode') }, true); });
    });
    root.querySelectorAll('[data-global-toggle]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var p = {};
        p[cb.getAttribute('data-global-toggle')] = cb.checked;
        patchGlobalConfig(p);
      });
    });

    root.querySelectorAll('[data-app-apply]').forEach(function (b) {
      b.addEventListener('click', function () {
        applyAppNow(b.getAttribute('data-app-apply'), { force: false });
      });
    });
    root.querySelectorAll('[data-app-restore]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-app-restore');
        apiJson('/api/apps/' + encodeURIComponent(id) + '/restore', { method: 'POST', body: {} }).then(function () {
          showToast('已还原软件原貌');
          loadState();
        });
      });
    });

    var fileInput = root.querySelector('#ds-file-input');
    var dsskinInput = root.querySelector('#ds-dsskin-input');
    if (fileInput) {
      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (f) uploadLocalFile(f);
      });
    }
    if (dsskinInput) {
      dsskinInput.addEventListener('change', function () {
        var f = dsskinInput.files && dsskinInput.files[0];
        if (f) uploadLocalFile(f);
      });
    }

    root.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-action');
        if (act === 'upload-file' && fileInput) fileInput.click();
        else if (act === 'import-dsskin' && dsskinInput) dsskinInput.click();
        else if (act === 'hide-guide') {
          state.showGuide = false;
          saveGuidePref(false);
          render();
        } else if (act === 'toggle-guide') {
          state.showGuide = !state.showGuide;
          saveGuidePref(state.showGuide);
          state.activeTab = 'home';
          render();
        } else if (act === 'toggle-uninstalled') {
          state.showUninstalled = !state.showUninstalled;
          render();
        } else if (act === 'toggle-takeover-steps') {
          state.showTakeoverSteps = !state.showTakeoverSteps;
          render();
        } else if (act === 'yield-to-conflict') {
          apiJson('/api/apps/' + encodeURIComponent(state.selectedAppId) + '/restore', { method: 'POST', body: {} }).then(function () {
            state.showTakeoverSteps = false;
            showToast('已切换为和平共存：' + currentApp().name + ' 交给 Obsidian Prism，梦境继续守护你的其他软件');
            loadState();
          });
        } else if (act === 'recheck-conflict') {
          showToast('正在重新检测插件状态…');
          apiJson('/api/apps/refresh', { method: 'POST', body: {} }).then(function () {
            loadState().then(function () {
              var a = currentApp();
              if (!hasPluginConflict(a)) {
                showToast('太棒了！未检测到冲突，现在可以直接点「应用到软件」生效');
              } else {
                showToast('检测到 ' + a.pluginConflicts[0].name + ' 仍处于开启状态');
              }
            });
          });
        } else if (act === 'force-takeover') {
          applyAppNow(state.selectedAppId, { force: true });
        } else if (act === 'apply-cur') {
          applyAppNow(state.selectedAppId, { force: false });
        } else if (act === 'reload-gallery') {
          loadGallery();
        } else if (act === 'scan-lib') {
          showToast('正在扫描 Steam 创意工坊与本地壁纸…');
          apiJson('/api/library/scan', { method: 'POST', body: {} }).then(function () { showToast('扫描完成'); loadState(); });
        } else if (act === 'refresh-apps') {
          showToast('正在刷新本机软件状态…');
          apiJson('/api/apps/refresh', { method: 'POST', body: {} }).then(function () { showToast('软件状态已更新'); loadState(); });
        } else if (act === 'sync-all') {
          apiJson('/api/sync', { method: 'POST', body: { from: state.selectedAppId } }).then(function (r) {
            showToast('已同步外观到其他 ' + (r.syncedApps ? r.syncedApps.length : 0) + ' 个软件');
            loadState();
          });
        } else if (act === 'restore-cur') {
          apiJson('/api/apps/' + encodeURIComponent(state.selectedAppId) + '/restore', { method: 'POST', body: {} }).then(function () {
            showToast('已还原 ' + currentApp().name);
            loadState();
          });
        } else if (act === 'restore-all') {
          apiJson('/api/restore-all', { method: 'POST', body: {} }).then(function () {
            showToast('已还原全部软件为原貌');
            loadState();
          });
        } else if (act === 'enable-shortcut') {
          apiJson('/api/apps/' + encodeURIComponent(state.selectedAppId) + '/shortcuts/enable', { method: 'POST', body: {} }).then(function (r) {
            showToast(r.ok ? '开启成功！下次正常双击软件图标就会自动带皮肤' : '未能修改快捷方式');
            loadShortcutStatus();
          });
        } else if (act === 'disable-shortcut') {
          apiJson('/api/apps/' + encodeURIComponent(state.selectedAppId) + '/shortcuts/disable', { method: 'POST', body: {} }).then(function () {
            showToast('已无损恢复原图标默认参数');
            loadShortcutStatus();
          });
        } else if (act === 'reset-canary') {
          apiJson('/api/apps/' + encodeURIComponent(state.selectedAppId) + '/wake', { method: 'POST', body: {} }).then(function () {
            showToast('已解除保护模式');
            loadState();
          });
        } else if (act === 'step-next') {
          apiJson('/api/playlists/step', { method: 'POST', body: { dir: 1 } }).then(function () {
            showToast('已切换到下一张壁纸');
            loadState();
          });
        }
      });
    });
  }

  // Global drag-and-drop import for images, videos, and legacy .dsskin files
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    e.preventDefault();
    dragDepth += 1;
    if (!state.draggingOver) {
      state.draggingOver = true;
      var ov = document.getElementById('ds-drop-overlay');
      if (ov) ov.classList.add('show');
    }
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function (e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0 && state.draggingOver) {
      state.draggingOver = false;
      var ov = document.getElementById('ds-drop-overlay');
      if (ov) ov.classList.remove('show');
    }
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    state.draggingOver = false;
    var ov = document.getElementById('ds-drop-overlay');
    if (ov) ov.classList.remove('show');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) uploadLocalFile(f);
  });

  loadState();
})();

</script>
</body>
</html>
