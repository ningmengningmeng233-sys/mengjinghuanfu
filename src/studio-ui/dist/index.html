  <style>
:root {
  --bg-deep: #070912;
  --bg-shell: #0b0e18;
  --bg-panel: rgba(16, 20, 32, 0.78);
  --bg-panel-solid: #111524;
  --bg-card: rgba(24, 29, 46, 0.68);
  --bg-card-hi: rgba(33, 40, 62, 0.82);
  --bg-hover: rgba(255, 255, 255, 0.065);
  --border: rgba(255, 255, 255, 0.085);
  --border-hi: rgba(255, 255, 255, 0.17);
  --specular: rgba(255, 255, 255, 0.11);
  --fg: #f4f6fc;
  --fg-2: #c6cde0;
  --fg-muted: #848ea8;
  --accent: #68a4ff;
  --accent-2: #a78bfa;
  --accent-cyan: #5ce1e6;
  --accent-soft: rgba(104, 164, 255, 0.16);
  --accent-glow: rgba(104, 164, 255, 0.36);
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.15);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --r-island: 18px;
  --r-card: 14px;
  --r-ctl: 10px;
  --shadow-island: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 var(--specular);
  --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --font: 'Segoe UI Variable', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', -apple-system, sans-serif;
}

html[data-prism-theme="light"] {
  --bg-deep: #e9eff8;
  --bg-shell: #eef3fb;
  --bg-panel: rgba(255, 255, 255, 0.84);
  --bg-panel-solid: #ffffff;
  --bg-card: rgba(246, 249, 255, 0.86);
  --bg-card-hi: rgba(255, 255, 255, 0.96);
  --bg-hover: rgba(15, 23, 42, 0.05);
  --border: rgba(15, 23, 42, 0.09);
  --border-hi: rgba(15, 23, 42, 0.18);
  --specular: rgba(255, 255, 255, 0.92);
  --fg: #0f172a;
  --fg-2: #334155;
  --fg-muted: #64748b;
  --accent: #3b82f6;
  --accent-2: #8b5cf6;
  --accent-soft: rgba(59, 130, 246, 0.12);
  --accent-glow: rgba(59, 130, 246, 0.26);
  --shadow-island: 0 16px 40px rgba(15, 23, 42, 0.08), inset 0 1px 0 var(--specular);
  --shadow-card: 0 6px 18px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

*, *::before, *::after { box-sizing: border-box; }
html, body, #app {
  width: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: var(--font);
  font-size: 13px;
  color: var(--fg);
  background: var(--bg-deep);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* Dynamic ambient aurora backdrop */
body::before, body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 0;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.42;
  transition: background 450ms ease;
}
body::before {
  width: 520px;
  height: 520px;
  left: -140px;
  top: -160px;
  background: radial-gradient(circle, var(--accent) 0%, transparent 68%);
}
body::after {
  width: 480px;
  height: 480px;
  right: -120px;
  bottom: -160px;
  background: radial-gradient(circle, var(--accent-2) 0%, transparent 68%);
}
#app { position: relative; z-index: 1; }

/* Custom sleek scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

/* Boot splash */
.ds-boot {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.ds-boot-icon {
  width: 72px;
  height: 72px;
  border-radius: 18px;
  box-shadow: 0 14px 36px rgba(92, 225, 230, 0.25);
  animation: ds-float 2.4s ease-in-out infinite;
}
@keyframes ds-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.ds-boot-title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
.ds-boot-sub { font-size: 12.5px; color: var(--fg-muted); }

/* Main two-column shell */
.ds-shell {
  display: grid;
  grid-template-columns: 224px 1fr;
  height: 100dvh;
  gap: 12px;
  padding: 12px;
}

.ds-sidebar, .ds-main {
  background: var(--bg-panel);
  backdrop-filter: blur(26px) saturate(1.4);
  -webkit-backdrop-filter: blur(26px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--r-island);
  box-shadow: var(--shadow-island);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* Sidebar brand */
.ds-brand {
  padding: 16px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 11px;
}
.ds-brand-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
.ds-brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.ds-brand-title {
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.ds-brand-sub { font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
.ds-ver-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding: 2px 6px;
  border-radius: 99px;
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.22), rgba(167, 139, 250, 0.25));
  border: 1px solid rgba(167, 139, 250, 0.38);
  color: #dbeafe;
  flex-shrink: 0;
}

/* Sidebar app list with magnetic sliding glass indicator & hover pill */
.ds-apps-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
}
.ds-nav-indicator {
  position: absolute;
  left: 10px;
  right: 10px;
  top: 0;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.16), rgba(104, 164, 255, 0.18) 52%, rgba(167, 139, 250, 0.14));
  border: 1px solid rgba(126, 178, 255, 0.46);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.24), 0 0 18px rgba(104, 164, 255, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  will-change: transform, height;
  transition: transform 340ms cubic-bezier(0.32, 1.25, 0.48, 1), height 240ms ease, opacity 180ms ease;
}
.ds-nav-indicator::before {
  content: '';
  position: absolute;
  left: -1px;
  top: 20%;
  bottom: 20%;
  width: 3.5px;
  border-radius: 99px;
  background: linear-gradient(180deg, #5ce1e6, #68a4ff, #a78bfa);
  box-shadow: 0 0 12px rgba(92, 225, 230, 0.85);
}
.ds-nav-indicator.instant {
  transition: none !important;
}
.ds-nav-hover {
  position: absolute;
  left: 10px;
  right: 10px;
  top: 0;
  height: 48px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.055);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  will-change: transform, opacity;
  transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), height 180ms ease, opacity 160ms ease;
}
.ds-nav-group-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  padding: 8px 8px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  letter-spacing: 0.3px;
  position: relative;
  z-index: 1;
}
.ds-app-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--fg-2);
  cursor: pointer;
  text-align: left;
  transition: color 180ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1), opacity 180ms ease;
  position: relative;
  z-index: 1;
}
.ds-app-row:hover {
  color: var(--fg);
}
.ds-app-row:active {
  transform: scale(0.975);
}
.ds-app-row.uninstalled { opacity: 0.56; }
.ds-app-row.uninstalled:hover, .ds-app-row.uninstalled.active { opacity: 1; }
.ds-app-row.active {
  background: transparent;
  border-color: transparent;
  color: var(--fg);
}
.ds-app-row.active .ds-app-icon-wrap {
  transform: scale(1.06);
  border-color: rgba(147, 197, 253, 0.42);
  box-shadow: 0 4px 12px rgba(104, 164, 255, 0.25);
}
.ds-app-row .ds-app-icon-wrap {
  transition: transform 280ms cubic-bezier(0.32, 1.25, 0.48, 1), border-color 220ms ease, box-shadow 220ms ease;
}
.ds-app-icon-wrap {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
}
.ds-app-icon-img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35));
}
.ds-cur-app-icon {
  width: 26px;
  height: 26px;
  object-fit: contain;
  display: block;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
}

/* Compact 1-line conflict / coexistence strip */
.ds-compact-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 9px 13px;
  border-radius: 12px;
  border: 1px solid rgba(251, 191, 36, 0.36);
  background: rgba(251, 191, 36, 0.09);
  font-size: 12px;
}
.ds-compact-bar.peaceful {
  border-color: rgba(167, 139, 250, 0.38);
  background: rgba(167, 139, 250, 0.1);
}
.ds-compact-bar.accent {
  border-color: rgba(104, 164, 255, 0.32);
  background: rgba(104, 164, 255, 0.09);
}
.ds-compact-bar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-2);
  min-width: 0;
  flex: 1;
}
.ds-compact-bar-left b { color: var(--fg); }

/* Segmented mode pill inside gallery header */
.ds-seg-pill {
  display: inline-flex;
  padding: 3px;
  gap: 3px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid var(--border);
}
.ds-seg-btn {
  border: none;
  background: transparent;
  color: var(--fg-2);
  padding: 5px 12px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 140ms ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.ds-seg-btn:hover { color: var(--fg); }
.ds-seg-btn.active {
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.22), rgba(104, 164, 255, 0.26), rgba(167, 139, 250, 0.24));
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

/* Lightweight modal-like help popover */
.ds-help-popover {
  border-radius: 12px;
  border: 1px solid rgba(104, 164, 255, 0.32);
  background: rgba(14, 19, 34, 0.92);
  padding: 12px 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 12px;
  color: var(--fg-2);
  line-height: 1.6;
}
.ds-help-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  color: var(--fg);
}
.ds-app-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.ds-app-name-line {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ds-app-sub-line {
  font-size: 11px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.ds-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #525d78;
}
.ds-dot.active {
  background: var(--ok);
  box-shadow: 0 0 9px rgba(52, 211, 153, 0.7);
}
.ds-dot.running {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(104, 164, 255, 0.55);
}
.ds-dot.warn {
  background: var(--warn);
  box-shadow: 0 0 8px rgba(251, 191, 36, 0.65);
}
.ds-dot.yielded {
  background: #a78bfa;
  box-shadow: 0 0 8px rgba(167, 139, 250, 0.6);
}

.ds-uninstalled-toggle {
  background: none;
  border: none;
  color: var(--fg-muted);
  font-size: 11px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 6px;
}
.ds-uninstalled-toggle:hover { color: var(--fg); background: var(--bg-hover); }

/* Sidebar footer */
.ds-sidebar-foot {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: rgba(0, 0, 0, 0.14);
}

/* Main Header */
.ds-header {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  background: rgba(255, 255, 255, 0.015);
}
.ds-header-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
.ds-cur-title { font-size: 16px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; }
.ds-status-pill {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.ds-status-pill.ok { border-color: rgba(52, 211, 153, 0.35); background: var(--ok-soft); color: #a7f3d0; }
.ds-status-pill.warn { border-color: rgba(251, 191, 36, 0.4); background: var(--warn-soft); color: #fde68a; }
.ds-status-pill.yielded { border-color: rgba(167, 139, 250, 0.4); background: rgba(167, 139, 250, 0.15); color: #ddd6fe; }

.ds-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ds-tabs {
  display: flex;
  gap: 4px;
  background: rgba(0, 0, 0, 0.22);
  padding: 3px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.ds-tab {
  border: none;
  background: transparent;
  color: var(--fg-2);
  padding: 6px 13px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 140ms ease;
}
.ds-tab:hover { color: var(--fg); }
.ds-tab.active {
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.26), rgba(167, 139, 250, 0.24));
  color: #fff;
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

/* Body scrollable workspace */
.ds-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

/* Onboarding 3-step guide */
.ds-guide-card {
  border-radius: var(--r-card);
  border: 1px solid rgba(104, 164, 255, 0.32);
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.08), rgba(104, 164, 255, 0.1) 48%, rgba(167, 139, 250, 0.1));
  padding: 15px 18px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ds-guide-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ds-guide-title {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ds-guide-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.ds-guide-step {
  background: rgba(10, 14, 25, 0.56);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.ds-step-num {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent), var(--accent-2));
  color: #070a14;
  font-weight: 800;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ds-step-body { display: flex; flex-direction: column; gap: 3px; line-height: 1.45; }
.ds-step-body b { font-size: 12.5px; color: var(--fg); }
.ds-step-body span { font-size: 11.5px; color: var(--fg-muted); }
.ds-guide-note {
  font-size: 11.5px;
  color: var(--fg-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 2px;
}

/* Obsidian Prism Coexistence & Switch Hub */
.ds-compat-hub {
  border-radius: var(--r-card);
  border: 1px solid rgba(251, 191, 36, 0.42);
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.11), rgba(167, 139, 250, 0.1));
  padding: 15px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--shadow-card);
}
.ds-compat-hub.peaceful {
  border-color: rgba(167, 139, 250, 0.45);
  background: linear-gradient(135deg, rgba(167, 139, 250, 0.13), rgba(52, 211, 153, 0.08));
}
.ds-compat-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ds-compat-title {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ds-compat-desc {
  font-size: 12px;
  color: var(--fg-2);
  margin-top: 4px;
  line-height: 1.5;
}
.ds-compat-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.ds-compat-option {
  background: rgba(10, 13, 24, 0.62);
  border: 1px solid var(--border-hi);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}
.ds-compat-option.active-plan {
  border-color: rgba(52, 211, 153, 0.6);
  box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.25);
}
.ds-compat-opt-title { font-size: 13px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.ds-compat-opt-desc { font-size: 11.5px; color: var(--fg-muted); line-height: 1.5; margin-top: 4px; }
.ds-compat-steps-box {
  background: rgba(0, 0, 0, 0.28);
  border: 1px dashed rgba(255, 255, 255, 0.16);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 11.5px;
  color: var(--fg-2);
  line-height: 1.55;
}

/* Mode Switcher Cards (Mode 1: Prism Liquid Glass vs Mode 2: Classic Theme Library) */
.ds-mode-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ds-mode-card {
  position: relative;
  border-radius: var(--r-card);
  border: 1px solid var(--border);
  background: var(--bg-card);
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  color: var(--fg);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
  overflow: hidden;
}
.ds-mode-card:hover {
  border-color: var(--border-hi);
  background: var(--bg-card-hi);
  transform: translateY(-1px);
}
.ds-mode-card.active {
  border-color: rgba(114, 178, 255, 0.72);
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.12), rgba(104, 164, 255, 0.14) 55%, rgba(167, 139, 250, 0.14));
  box-shadow: 0 8px 24px rgba(104, 164, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
.ds-mode-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
}
.ds-mode-card.active .ds-mode-icon {
  background: linear-gradient(135deg, rgba(92, 225, 230, 0.28), rgba(167, 139, 250, 0.32));
  border-color: rgba(255, 255, 255, 0.22);
}
.ds-mode-body { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.ds-mode-title {
  font-size: 13.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ds-mode-tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 99px;
  background: rgba(92, 225, 230, 0.18);
  color: #a5f3fc;
  font-weight: 600;
}
.ds-mode-tag.classic {
  background: rgba(167, 139, 250, 0.2);
  color: #e9d5ff;
}
.ds-mode-desc { font-size: 11.5px; color: var(--fg-muted); line-height: 1.45; }

/* Banner notifications */
.ds-banner {
  padding: 12px 15px;
  border-radius: var(--r-card);
  border: 1px solid var(--border-hi);
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ds-banner.warn { border-color: rgba(251, 191, 36, 0.45); background: var(--warn-soft); }
.ds-banner.accent {
  border-color: rgba(104, 164, 255, 0.4);
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.14), rgba(167, 139, 250, 0.08));
}
.ds-banner-text { flex: 1; min-width: 180px; line-height: 1.5; font-size: 12.5px; }

/* Hero Live Preview + Quick Controls Split Stage */
/* Default wide-screen friendly layout: 16:10 true desktop aspect ratio preview on top, sleek controls below;
   switches to side-by-side ONLY on wide desktop windows (>= 1180px) while strictly locking 16:10 aspect ratio */
.ds-hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  align-items: start;
}
@media (min-width: 1180px) {
  .ds-hero-grid {
    grid-template-columns: minmax(480px, 1.55fr) minmax(300px, 1fr);
    align-items: start;
  }
}

.ds-stage-wrap {
  position: relative;
  border-radius: var(--r-card);
  overflow: hidden;
  border: 1px solid var(--border-hi);
  background: #0b0f1d;
  width: 100%;
  aspect-ratio: 16 / 10;
  max-height: 410px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-card);
}
.ds-stage-bg, .ds-stage-video, .ds-stage-iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  object-fit: cover;
  background-size: cover;
  background-position: center;
  image-rendering: high-quality;
  background-image: radial-gradient(circle at 20% 25%, #38bdf8 0%, transparent 45%),
                    radial-gradient(circle at 80% 70%, #a855f7 0%, transparent 50%),
                    linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d1a 100%);
  transition: filter 180ms ease, transform 220ms ease;
}
.ds-stage-wrap.peek-raw .ds-mock-window,
.ds-stage-wrap.peek-raw .ds-stage-scrim {
  opacity: 0 !important;
  pointer-events: none;
}
.ds-stage-wrap .ds-mock-window {
  transition: opacity 150ms ease, padding 180ms ease, gap 180ms ease;
}
.ds-stage-scrim {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: background 140ms ease;
}
/* Full-bleed simulated app window matching actual Prism 6-layer glass layout */
.ds-mock-window {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 10px 46px;
  gap: 8px;
  color: #f3f6ff;
  transition: padding 180ms ease, gap 180ms ease;
  min-height: 0;
}
.ds-mock-window.light-preview { color: #0f172a; }
.ds-mock-window.flush { padding: 0 0 42px; gap: 0; }

.ds-mock-bar {
  height: 28px;
  padding: 0 11px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 11px;
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: background 140ms ease, backdrop-filter 140ms ease;
  flex-shrink: 0;
}
.ds-mock-window.light-preview .ds-mock-bar { border-color: rgba(15, 23, 42, 0.1); }
.ds-mock-window.flush .ds-mock-bar { border-radius: 0; border-left: none; border-right: none; border-top: none; }
.ds-mock-dots { display: flex; gap: 5px; }
.ds-mock-dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.ds-mock-dots i:nth-child(1) { background: #fb7185; }
.ds-mock-dots i:nth-child(2) { background: #fbbf24; }
.ds-mock-dots i:nth-child(3) { background: #34d399; }

.ds-mock-body {
  flex: 1;
  display: grid;
  grid-template-columns: 132px 1fr;
  gap: 8px;
  min-height: 0;
}
.ds-mock-window.flush .ds-mock-body { gap: 0; }

.ds-mock-side, .ds-mock-pane {
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 9px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: background 140ms ease, backdrop-filter 140ms ease;
  overflow: hidden;
}
.ds-mock-window.light-preview .ds-mock-side,
.ds-mock-window.light-preview .ds-mock-pane { border-color: rgba(15, 23, 42, 0.1); }
.ds-mock-window.flush .ds-mock-side,
.ds-mock-window.flush .ds-mock-pane { border-radius: 0; border-top: none; border-bottom: none; }

.ds-mock-nav-item {
  font-size: 10.5px;
  padding: 4px 7px;
  border-radius: 6px;
  opacity: 0.78;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ds-mock-nav-item.active {
  opacity: 1;
  font-weight: 700;
  background: rgba(104, 164, 255, 0.24);
  border-left: 2.5px solid var(--accent);
}
.ds-mock-chat-q {
  align-self: flex-end;
  font-size: 10.5px;
  padding: 5px 9px;
  border-radius: 9px;
  background: var(--accent);
  color: #ffffff;
  font-weight: 500;
  max-width: 82%;
}
.ds-mock-chat-a {
  font-size: 10.5px;
  line-height: 1.45;
  opacity: 0.92;
}
.ds-mock-code-card {
  margin-top: 2px;
  border-radius: 7px;
  padding: 6px 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 10px;
  line-height: 1.45;
  opacity: 0.94;
}
.ds-mock-window.light-preview .ds-mock-code-card { border-color: rgba(15, 23, 42, 0.1); }
.ds-mock-code-kw { color: var(--accent); font-weight: 600; }
.ds-mock-input-bar {
  margin-top: auto;
  height: 24px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(0, 0, 0, 0.16);
  padding: 0 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  opacity: 0.72;
}
.ds-mock-window.light-preview .ds-mock-input-bar {
  border-color: rgba(15, 23, 42, 0.12);
  background: rgba(255, 255, 255, 0.45);
}

.ds-stage-foot {
  position: absolute;
  left: 9px;
  right: 9px;
  bottom: 8px;
  z-index: 4;
  padding: 6px 10px;
  border-radius: 9px;
  background: rgba(8, 11, 20, 0.76);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ds-stage-wall-info { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ds-stage-wall-name { font-size: 12px; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-stage-live-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(92, 225, 230, 0.22);
  color: #a5f3fc;
  flex-shrink: 0;
}

/* Right control card next to preview stage */
.ds-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  box-shadow: var(--shadow-card);
}
.ds-sec-title {
  font-weight: 700;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.ds-muted { color: var(--fg-muted); font-size: 12px; }

/* 4 Scene preset cards: 4-across when controls sit below wide preview, 2x2 when side-by-side */
.ds-scene-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
@media (min-width: 1180px) {
  .ds-scene-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .ds-scene-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.ds-sliders-stack {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
@media (min-width: 1180px) {
  .ds-sliders-stack { grid-template-columns: 1fr; gap: 10px; }
}
@media (max-width: 720px) {
  .ds-sliders-stack { grid-template-columns: 1fr; gap: 10px; }
}
.ds-filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.ds-dyn-card-sub {
  font-size: 11px;
  color: var(--fg-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ds-url-import-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 9px 11px;
  border-radius: 11px;
  background: rgba(8, 12, 22, 0.55);
  border: 1px solid var(--border);
}
.ds-scene-card {
  border: 1px solid var(--border);
  background: rgba(12, 16, 28, 0.62);
  color: var(--fg);
  border-radius: 11px;
  padding: 10px 11px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: all 150ms ease;
}
.ds-scene-card:hover { border-color: var(--border-hi); transform: translateY(-1px); background: rgba(24, 30, 48, 0.8); }
.ds-scene-card.active {
  border-color: var(--accent);
  background: linear-gradient(135deg, rgba(104, 164, 255, 0.2), rgba(167, 139, 250, 0.14));
  box-shadow: 0 0 0 1px rgba(104, 164, 255, 0.3);
}
.ds-scene-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ds-scene-name { font-weight: 700; font-size: 12.5px; }
.ds-scene-ico { font-size: 13px; opacity: 0.9; }
.ds-scene-desc { font-size: 11px; color: var(--fg-muted); line-height: 1.35; }

/* Custom sleek sliders */
.ds-slider-box { display: flex; flex-direction: column; gap: 6px; }
.ds-slider-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-2); }
.ds-slider-val {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--fg);
}
input[type="range"].ds-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent-cyan) 0%, var(--accent) var(--pct, 50%), rgba(255, 255, 255, 0.12) var(--pct, 50%));
  outline: none;
  cursor: pointer;
}
input[type="range"].ds-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid var(--accent);
  box-shadow: 0 0 12px var(--accent-glow), 0 2px 6px rgba(0, 0, 0, 0.4);
  transition: transform 120ms ease;
}
input[type="range"].ds-range::-webkit-slider-thumb:hover { transform: scale(1.15); }

/* Direct color scheme dots bar */
.ds-scheme-dots {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ds-scheme-dot-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px 4px 6px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: rgba(12, 16, 28, 0.55);
  color: var(--fg-2);
  font-size: 11.5px;
  cursor: pointer;
  transition: all 140ms ease;
}
.ds-scheme-dot-btn:hover { border-color: var(--border-hi); color: var(--fg); }
.ds-scheme-dot-btn.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--fg);
  font-weight: 600;
}
.ds-swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  flex-shrink: 0;
}

/* Buttons */
.ds-btn {
  border: 1px solid var(--border-hi);
  background: rgba(255, 255, 255, 0.055);
  color: var(--fg);
  padding: 8px 13px;
  border-radius: var(--r-ctl);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 150ms ease;
  white-space: nowrap;
}
.ds-btn:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 255, 255, 0.28); }
.ds-btn:active { transform: scale(0.98); }
.ds-btn.primary {
  background: linear-gradient(135deg, #4f8cff 0%, #7c6bff 100%);
  border-color: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  box-shadow: 0 6px 18px rgba(96, 138, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.26);
}
.ds-btn.primary:hover {
  filter: brightness(1.08);
  box-shadow: 0 8px 24px rgba(96, 138, 255, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.32);
}
.ds-btn.success {
  background: linear-gradient(135deg, #10b981, #059669);
  border-color: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}
.ds-btn.danger {
  border-color: rgba(248, 113, 113, 0.42);
  background: rgba(248, 113, 113, 0.1);
  color: #fecaca;
}
.ds-btn.danger:hover { background: rgba(248, 113, 113, 0.2); border-color: rgba(248, 113, 113, 0.7); }
.ds-btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.ds-btn.ghost:hover { background: var(--bg-hover); color: var(--fg); }
.ds-btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 8px; }

/* Pill Switch (iOS/macOS style toggle) */
.ds-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 12px;
  color: var(--fg-2);
}
.ds-switch input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}
.ds-switch-track {
  width: 38px;
  height: 22px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid var(--border);
  position: relative;
  transition: background 180ms ease, border-color 180ms ease;
  flex-shrink: 0;
}
.ds-switch-track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
  transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-switch input:checked + .ds-switch-track {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  border-color: rgba(255, 255, 255, 0.22);
}
.ds-switch input:checked + .ds-switch-track::after { transform: translateX(16px); }

/* Toolbar, search, chips */
.ds-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ds-input {
  flex: 1;
  min-width: 150px;
  background: rgba(8, 11, 20, 0.65);
  border: 1px solid var(--border);
  border-radius: var(--r-ctl);
  color: var(--fg);
  padding: 7px 12px;
  font-size: 12.5px;
  outline: none;
  transition: border-color 140ms ease;
}
.ds-input:focus { border-color: var(--accent); }
.ds-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ds-chip {
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--fg-2);
  padding: 5px 11px;
  border-radius: 99px;
  cursor: pointer;
  font-size: 12px;
  transition: all 140ms ease;
}
.ds-chip:hover { border-color: var(--border-hi); color: var(--fg); }
.ds-chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--fg);
  font-weight: 600;
}

/* Cinema 16:10 Wallpaper Gallery */
.ds-wall-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 12px;
}
.ds-wall-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: #0d111e;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-wall-card:hover {
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38);
}
.ds-wall-card.active {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 1.5px var(--accent-cyan), 0 10px 26px rgba(92, 225, 230, 0.22);
}
.ds-wall-thumb {
  aspect-ratio: 16 / 10;
  background: linear-gradient(135deg, #161d33, #0e1322);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  font-size: 11.5px;
}
.ds-wall-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 280ms ease;
}
.ds-wall-card:hover .ds-wall-thumb img { transform: scale(1.05); }
.ds-wall-badge {
  position: absolute;
  top: 7px;
  right: 7px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(7, 10, 18, 0.72);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #f1f5f9;
}
.ds-wall-active-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(56, 189, 248, 0.45);
}
.ds-wall-meta {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: rgba(14, 18, 30, 0.94);
}
.ds-wall-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }

/* Advanced drawer */
details.prism-adv-drawer {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 12px 16px;
  box-shadow: var(--shadow-card);
}
details.prism-adv-drawer > summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  color: var(--fg-2);
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
details.prism-adv-drawer > summary::-webkit-details-marker { display: none; }
.ds-adv-body {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.ds-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
}

/* Dropzone overlay */
.ds-drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 950;
  background: rgba(7, 10, 18, 0.82);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.ds-drop-overlay.show { display: flex; }
.ds-drop-box {
  width: min(460px, 92vw);
  border: 2px dashed var(--accent-cyan);
  border-radius: 20px;
  padding: 36px 24px;
  text-align: center;
  background: rgba(16, 22, 38, 0.9);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ds-drop-box b { font-size: 16px; color: #fff; }
.ds-drop-box span { font-size: 12.5px; color: var(--fg-muted); }

/* Toast */
.ds-toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: rgba(14, 18, 30, 0.96);
  backdrop-filter: blur(16px);
  color: #f8fafc;
  border: 1px solid rgba(114, 178, 255, 0.42);
  padding: 11px 16px;
  border-radius: 12px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  z-index: 999;
  font-size: 12.5px;
  font-weight: 500;
  max-width: 420px;
  line-height: 1.45;
}

/* Responsive: Medium / Sidecar Aux Pane (<= 880px) */
@media (max-width: 880px) {
  .ds-hero-grid { grid-template-columns: 1fr; }
  .ds-guide-steps { grid-template-columns: 1fr; }
  .ds-compat-options { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .ds-shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    padding: 8px;
    gap: 8px;
  }
  .ds-brand { padding: 10px 12px; }
  .ds-apps-scroll {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 8px;
    gap: 6px;
  }
  .ds-nav-group-label { display: none; }
  .ds-app-row { width: auto; flex-shrink: 0; padding: 6px 10px; }
  .ds-app-avatar { width: 24px; height: 24px; font-size: 11px; }
  .ds-sidebar-foot { flex-direction: row; padding: 8px; }
  .ds-sidebar-foot .ds-btn { flex: 1; }
  .ds-mode-grid { grid-template-columns: 1fr; }
  .ds-header { padding: 11px 14px; }
  .ds-body { padding: 12px 14px 20px; }
}

/* ============================================================================
 * v4.0.1 Fluid Optical Motion, Zero-Jank Scroll & Anti-Anxiety Prism Splash
 * ============================================================================ */
@keyframes dsPrismSpin {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.06); }
  100% { transform: rotate(360deg) scale(1); }
}
@keyframes dsPrismBreathe {
  0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 24px rgba(104, 164, 255, 0.45)); }
  50% { transform: translateY(-4px) scale(1.04); filter: drop-shadow(0 0 38px rgba(167, 139, 250, 0.68)); }
}
@keyframes dsBootSweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(260%); }
}
@keyframes dsOpticalSweep {
  0% { transform: translateX(-130%) skewX(-22deg); opacity: 0; }
  22% { opacity: 0.92; }
  100% { transform: translateX(230%) skewX(-22deg); opacity: 0; }
}
@keyframes dsStageReveal {
  0% { opacity: 0.25; transform: scale(1.045); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes dsAppSwitchIn {
  0% { opacity: 0.35; transform: translateY(8px) scale(0.992); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes dsAppliedRing {
  0% { box-shadow: 0 0 0 0 rgba(92, 225, 230, 0.65), 0 18px 46px rgba(0, 0, 0, 0.42); }
  100% { box-shadow: 0 0 0 16px rgba(92, 225, 230, 0), 0 18px 46px rgba(0, 0, 0, 0.42); }
}

.ds-boot {
  gap: 14px;
  background: radial-gradient(circle at 50% 42%, rgba(92, 225, 230, 0.08), rgba(167, 139, 250, 0.05) 38%, transparent 70%);
}
.ds-boot-halo {
  position: relative;
  width: 112px;
  height: 112px;
  display: grid;
  place-items: center;
  margin-bottom: 6px;
}
.ds-boot-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: rgba(92, 225, 230, 0.85);
  border-right-color: rgba(167, 139, 250, 0.55);
  animation: dsPrismSpin 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.ds-boot-ring.r2 {
  inset: 9px;
  border-top-color: rgba(244, 114, 182, 0.68);
  border-right-color: transparent;
  border-bottom-color: rgba(104, 164, 255, 0.62);
  animation-duration: 3.8s;
  animation-direction: reverse;
}
.ds-boot-icon {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  animation: dsPrismBreathe 2.8s ease-in-out infinite;
}
.ds-boot-bar {
  width: 210px;
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.09);
  overflow: hidden;
  position: relative;
  margin-top: 4px;
}
.ds-boot-bar-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 42%;
  border-radius: 999px;
  background: linear-gradient(90deg, #5ce1e6, #68a4ff, #a78bfa, #f472b6);
  animation: dsBootSweep 1.55s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

/* Smooth GPU-accelerated transitions across preview glass & interactive controls */
.ds-stage-wrap {
  position: relative;
  overflow: hidden;
  transform: translateZ(0);
  transition: box-shadow 0.36s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.36s ease;
}
.ds-stage-wrap.ds-applied-pulse {
  animation: dsAppliedRing 0.72s cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-prism-sweep {
  position: absolute;
  inset: -10% 0;
  width: 46%;
  z-index: 9;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(92, 225, 230, 0.24) 32%,
    rgba(255, 255, 255, 0.42) 50%,
    rgba(167, 139, 250, 0.26) 68%,
    rgba(255, 255, 255, 0) 100%
  );
  mix-blend-mode: screen;
}
.ds-prism-sweep.run {
  animation: dsOpticalSweep 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.ds-stage-bg,
.ds-stage-video,
.ds-stage-iframe {
  transition: filter 0.24s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
  will-change: transform, opacity;
}
.ds-stage-wrap.ds-media-entering .ds-stage-bg,
.ds-stage-wrap.ds-media-entering .ds-stage-video,
.ds-stage-wrap.ds-media-entering .ds-stage-iframe {
  animation: dsStageReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-stage-scrim,
.ds-mock-bar,
.ds-mock-side,
.ds-mock-pane,
.ds-mock-code-card {
  transition: background-color 0.28s ease, background 0.28s ease, backdrop-filter 0.22s ease, -webkit-backdrop-filter 0.22s ease, border-color 0.28s ease, color 0.24s ease;
}
.ds-mock-window {
  transition: padding 0.3s cubic-bezier(0.22, 1, 0.36, 1), gap 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.ds-body.ds-tab-enter > * {
  animation: dsAppSwitchIn 0.26s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Crisp micro-spring hover/press feel + zero-jank card containment */
.ds-btn,
.ds-scene-card,
.ds-scheme-dot-btn,
.ds-chip,
.ds-app-item,
.ds-tab,
.ds-wall-card,
.ds-dyn-card {

}
.ds-scene-card:hover,
.ds-wall-card:hover,
.ds-dyn-card:hover {
  transform: translateY(-2px);
}
.ds-btn:active,
.ds-scene-card:active,
.ds-scheme-dot-btn:active,
.ds-chip:active,
.ds-wall-card:active,

  transform: scale(0.975);
}
.ds-wall-card,
.ds-dyn-card {
  content-visibility: auto;

/* Directional fluid transition for right workspace when switching sidebar apps */
@keyframes dsSlideFromBelow {

  100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}
@keyframes dsSlideFromAbove {
  0% { opacity: 0.18; transform: translate3d(0, -14px, 0) scale(0.992); }
  100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}

.ds-body.ds-dir-down > * {

.ds-body.ds-dir-up > * {

}
.ds-header-left.ds-hdr-enter {

}

 name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n<title>极光流云 · Aurora Drift</title>\n<style>\n  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060a16; }\n  canvas { display: block; width: 100%; height: 100%; }\n</style>\n</head>\n<body>\n<canvas id=\"c\"></canvas>\n<script>\n(function() {\n  var canvas = document.getElementById('c');\n  var ctx = canvas.getContext('2d');\n  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 1.5);\n  var mouse = { x: -9999, y: -9999, active: false };\n  var paused = false;\n  function resize() {\n    W = window.innerWidth || 1280;\n    H = window.innerHeight || 720;\n    canvas.width = Math.max(1, Math.floor(W * DPR));\n    canvas.height = Math.max(1, Math.floor(H * DPR));\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n  }\n  window.addEventListener('resize', resize);\n  window.addEventListener('pointermove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; }, { passive: true });\n  window.addEventListener('pointerleave', function() { mouse.active = false; }, { passive: true });\n  document.addEventListener('visibilitychange', function() { paused = document.hidden; });\n  resize();\n  \n      var t = 0;\n      var ribbons = [\n        { y: 0.32, amp: 64, freq: 0.0022, speed: 0.011, hue: 188, alpha: 0.52, width: 165 },\n        { y: 0.48, amp: 78, freq: 0.0017, speed: -0.0085, hue: 224, alpha: 0.50, width: 205 },\n        { y: 0.64, amp: 58, freq: 0.0025, speed: 0.013, hue: 282, alpha: 0.46, width: 180 },\n        { y: 0.42, amp: 48, freq: 0.0030, speed: 0.008, hue: 160, alpha: 0.38, width: 135 }\n      ];\n      var stars = Array.from({ length: 75 }, function() {\n        return { x: Math.random(), y: Math.random() * 0.72, r: 0.6 + Math.random() * 1.4, p: Math.random() * 6.28 };\n      });\n      function frame() {\n        if (!paused) {\n          t += 1;\n          var bg = ctx.createLinearGradient(0, 0, 0, H);\n          bg.       var combined = [bgBlurPx > 0 ? ('blur(' + Math.round(bgBlurPx * 0.45) + 'px)') : '', extraFilter].filter(Boolean).join(' ');
      var mediaEl = wrap.querySelector('.ds-stage-bg, .ds-stage-video, .ds-stage-iframe');
      if (mediaEl) {
        mediaEl.style.filter = combined || 'none';
        mediaEl.style.transform = bgBlurPx > 0 ? 'scale(1.04)' : 'scale(1)';
      }
      var codeEl = wrap.querySelector('.ds-mock-code-card');
      if (codeEl) {
        var sch = schemeInfoOf(cfg.colorScheme);
        var baseRgb = isLight ? '248, 250, 255' : sch.panelBg;
        codeEl.style.background = cfg.codeReadabilityMode === 'solid'
          ? ('rgba(' + baseRgb + ', 0.96)')
          : cfg.codeReadabilityMode === 'frosted'
            ? ('rgba(' + baseRgb + ', 0.84)')
            : (isLight ? 'rgba(15, 23, 42, 0.06)' : 'rgba(255, 255, 255, 0.06)');
        codeEl.innerHTML = '<span class="ds-mock-code-kw">const</span> prism = { blur: <span class="ds-mock-code-kw">' + blurPx + 'px</span>, clarity: <span class="ds-mock-code-kw">"' + clarityPct + '%"</span> };';
      }
    }

    // Sync sliders & labels without rebuilding DOM
    var gEl = document.querySelector('input[data-slider="glassClarity"]');
    if (gEl) { gEl.value = String(clarityPct); gEl.style.setProperty('--pct', Math.round(((clarityPct - 4) / (80 - 4)) * 100) + '%'); }
    var bEl = document.querySelector('input[data-slider="glassBlur"]');
    if (bEl) { bEl.value = String(blurPx); bEl.style.setProperty('--pct', Math.round((blurPx / 24) * 100) + '%'); }
    var sEl = document.querySelector('input[data-slider="scrimOpacity"]');

    var v2 = document.getElementById('val-blur'); if (v2) v2.textContent = blurPx + 'px';
    var v3 = document.getElementById('val-scrim'); if (v3) v3.textContent = scrimPct + '%';

    // Sync active highlights on presets, schemes, filters, layout & theme buttons
    document.querySelectorAll('[data-scene-preset]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-scene-preset') === (cfg.preset || 'islands'));
    });
    document.querySelectorAll('[data-scheme]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-scheme') === (cfg.colorScheme || 'prism-default'));
    });
    document.querySelectorAll('[data-filter-preset]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-filter-preset') === (cfg.filterPreset || 'none'));
    });
    document.querySelectorAll('[data-layout]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-layout') === (cfg.layoutMode || 'islands'));
    });
    document.querySelectorAll('[data-theme-mode]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-theme-mode') === (cfg.themeMode || 'dark'));
    });
    document.querySelectorAll('[data-code-mode]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-code-mode') === (cfg.codeReadabilityMode || 'frosted'));
    });
  }

  function patchCurrentAppConfig(patch, andApply) {
    var appId = state.selectedAppId;
    var opticalOnly = isOpticalOnlyPatch(patch);
    var isWallChange = Boolean(patch && (patch.activeWallpaperId || patch.wallpaperId));
    applyOptimisticEntry(appId, patch);

    if (opticalOnly && document.getElementById('ds-stage-wrap')) {
      syncOpticalControlsInPlace(currentConfig());
      if (patch.preset || patch.colorScheme || patch.themeMode || patch.layoutMode || patch.filterPreset) {
        triggerPrismSweep(false);
      }
    } else {
      renderMainOnly({ preserveScroll: true, mediaSweep: isWallChange });
    }

    return apiJson('/api/apps/' + encodeURIComponent(appId) + '/config', {
      method: 'POST',
      body: patch,
    }).then(function (res) {
      if (!state.v4Store.apps) state.v4Store.apps = {};
      if (res && res.entry) state.v4Store.apps[appId] = res.entry;
      if (opticalOnly && document.getElementById('ds-stage-wrap')) {
        syncOpticalControlsInPlace(currentConfig());
      }
      if (andApply) {
        return apiJson('/api/apps/' + encodeURIComponent(appId) + '/apply', { method: 'POST', body: {} }).then(function (r) {
          if (r && r.ok && !r.skipped) {
            triggerAppliedPulse();
            showToast('已生效 · ' + currentApp().name);
          } else if (r && r.reason === 'not-debuggable') {
            showToast('已保存（打开目标软件后自动生效）');
          } else if (r && r.message && r.reason !== 'plugin-conflict') {
            showToast(r.message);
          }
        });
      }
    }).catch(function (err) {
      showToast(err.message || '保存失败');
    });
  }

  function patchGlobalConfig(patch) {
    return apiJson('/api/config', { method: 'POST', body: patch }).then(function (res) {
      state.v4Store.global = res.global;
      showToast('已更新');
      render();
    }).catch(function (err) { showToast(err.message); });
  }

  function installAndApplyDynamicTheme(dynId) {
    var dyn = findDynamicTheme(dynId);
    state.previewDynamicId = dynId;
    renderMainOnly({ preserveScroll: true, mediaSweep: true });
    showToast('正在加载动态主题「' + (dyn ? dyn.title : dynId) + '」…');
    apiJson('/api/dynamic-themes/' + encodeURIComponent(dynId) + '/install', { method: 'POST', body: {} }).then(function (res) {
      var patch = { skinEnabled: true };
      if (res && res.item && res.item.id) {
        patch.activeWallpaperId = res.item.id;
        patch.wallpaperId = res.item.id;
      }
      if (res && res.theme && res.theme.recommendedScheme) {
        patch.colorScheme = res.theme.recommendedScheme;
      }
      return loadState().then(function () {
        return patchCurrentAppConfig(patch, true);
      });
    }).catch(function (err) {
      if (err && err.status === 404) {
        showToast('已为你开启实时动态预览！重开独立桌面软件或重启插件后即可一键应用到目标软件');
      } else {
        showToast(err.message || '加载动态主题失败');
      }
    });
  }

  function uploadLocalFile(f) {
    if (!f) return;
    if (/\.dsskin$/i.test(f.name)) {
      showToast('正在导入 ' + f.name + '…');
      f.text().then(function (txt) {
        return apiJson('/api/import/dsskin', { method: 'POST', body: { rawText: txt } });
      }).then(function (res) {
        showToast('已导入皮肤「' + (res.title || f.name) + '」');
        loadState();
      }).catch(function (err) { showToast(err.message || '导入失败'); });
      return;
    }
    showToast('正在导入 ' + f.name + '…');
    apiFetch('/api/library/upload?filename=' + encodeURIComponent(f.name), {
      method: 'POST',
      headers: { 'Content-Type': f.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name) },
      body: f,
    }).then(function (r) { return r.json(); }).then(function (res) {
      showToast(res.duplicate ? '已复用相同壁纸' : '壁纸已导入并选中');
      state.previewDynamicId = '';
      loadState().then(function () {
        if (res && res.item && res.item.id) {
          patchCurrentAppConfig({ activeWallpaperId: res.item.id, wallpaperId: res.item.id, skinEnabled: true }, true);
        }
      });
    }).catch(function (err) { showToast('导入失败：' + err.message); });
  }

  function updateLivePreviewDom(clarityPct, blurPx, scrimPct) {
    var bar = document.getElementById('ds-preview-bar');
    var pane = document.getElementById('ds-preview-pane');
    var side = document.getElementById('ds-preview-side');
    var scrim = document.getElementById('ds-preview-scrim');
    var badge = document.getElementById('ds-preview-mode-badge');
    var codeEl = document.getElementById('ds-preview-code');
    var cfg = currentConfig();
    var sch = schemeInfoOf(cfg.colorScheme);
    var isLight = cfg.themeMode === 'light';
    var baseRgb = isLight ? '248, 250, 255' : sch.panelBg;
    var opacity = Math.max(0.16, Math.min(0.96, (100 - clarityPct) / 100));
    var paneAlpha = Math.max(0.14, Math.min(0.88, opacity * 0.78));
    var sideAlpha = Math.max(0.18, Math.min(0.92, paneAlpha + 0.06));
    var barAlpha = Math.max(0.22, Math.min(0.94, paneAlpha + 0.10));
    var sAlpha = Math.max(0, Math.min(0.85, scrimPct / 100));
    var bf = blurPx > 0 ? ('blur(' + blurPx + 'px) saturate(1.32)') : 'none';
    var frostBorder = blurPx > 0
      ? (isLight ? 'rgba(15, 23, 42, 0.14)' : 'rgba(255, 255, 255, 0.16)')
      : (isLight ? 'rgba(15, 23, 42, 0.08)' : 'rgba(147, 197, 253, 0.24)');
    if (bar) {
      bar.style.background = 'rgba(' + baseRgb + ', ' + barAlpha.toFixed(2) + ')';
      bar.style.backdropFilter = bf;
      bar.style.webkitBackdropFilter = bf;
      bar.style.borderColor = frostBorder;
    }
    if (pane) {
      pane.style.background = 'rgba(' + baseRgb + ', ' + paneAlpha.toFixed(2) + ')';
      pane.style.backdropFilter = bf;
      pane.style.webkitBackdropFilter = bf;
      pane.style.borderColor = frostBorder;
    }
    if (side) {
      side.style.background = 'rgba(' + baseRgb + ', ' + sideAlpha.toFixed(2) + ')';
      side.style.backdropFilter = bf;
      side.style.webkitBackdropFilter = bf;
      side.style.borderColor = frostBorder;
    }
    if (scrim) scrim.style.background = isLight ? ('rgba(248, 250, 255, ' + (sAlpha * 0.65).toFixed(2) + ')') : ('rgba(6, 9, 18, ' + sAlpha.toFixed(2) + ')');
    if (badge) {
      badge.textContent = blurPx === 0 ? '0px 原画超清' : ('毛玻璃 ' + blurPx + 'px');
    }
    if (codeEl) {
      codeEl.innerHTML = '<span class="ds-mock-code-kw">const</span> prism = { blur: <span class="ds-mock-code-kw">' + blurPx + 'px</span>, clarity: <span class="ds-mock-code-kw">"' + clarityPct + '%"</span> };';
    }
  }

          '<button class="ds-tab' + (state.activeTab === 'home' ? ' active' : '') + '" data-tab="home">外观</button>' +
          '<button class="ds-tab' + (state.activeTab === 'apps' ? ' active' : '') + '" data-tab="apps">软件</button>' +
